<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oslo Live</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<style>
  :root {
    --kant: #111111;
    --tekst: #111111;
    --dempet: #6b7280;
    --ok: #15803d;
    --feil: #b91c1c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #ede7d8; color: var(--tekst); }
  #kart { position: absolute; inset: 0; background: #ede7d8; }

  .panel {
    position: absolute; top: 16px; left: 16px; z-index: 10; width: 292px;
    background: rgba(255,255,255,.95);
    border: 1.5px solid var(--kant); border-radius: 10px;
    padding: 16px; box-shadow: 0 6px 20px rgba(0,0,0,.14);
    backdrop-filter: blur(8px);
    max-height: calc(100% - 32px); overflow-y: auto;
  }
  .panel h1 { margin: 0 0 2px; font-size: 20px; letter-spacing: -.02em; }
  .panel .under { margin: 0 0 14px; font-size: 12px; color: var(--dempet); }

  .lag { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 7px; cursor: pointer; }
  .lag:hover { background: #f3f4f6; }
  .lag input { accent-color: #111; width: 15px; height: 15px; cursor: pointer; flex: none; }
  .lag .prikk { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid #111; flex: none; }
  .lag .navn { flex: 1; font-size: 14px; }
  .lag .antall { font-size: 12px; color: var(--dempet); font-variant-numeric: tabular-nums; }
  .lag .antall.feil { color: var(--feil); }
  .lag .antall.ok { color: var(--ok); font-weight: 600; }
  .lag .visning { flex: none; font: inherit; font-size: 11px; padding: 2px 7px; border: 1.5px solid var(--kant); border-radius: 6px; background: #fff; cursor: pointer; }
  .lag .visning[aria-pressed="true"] { background: #111; color: #fff; }
  .tom { font-size: 13px; color: var(--dempet); line-height: 1.5; padding: 4px 2px; }
  .bunn { margin-top: 12px; padding-top: 12px; border-top: 1px solid #e5e7eb; font-size: 11px; color: var(--dempet); display: flex; justify-content: space-between; }

  .kamera {
    position: absolute; bottom: 24px; right: 16px; z-index: 10;
    display: flex; flex-direction: column; gap: 6px;
  }
  .kamera button {
    background: rgba(255,255,255,.95);
    border: 1.5px solid var(--kant); color: var(--tekst);
    border-radius: 8px; padding: 8px 12px; font-size: 12px; cursor: pointer;
    backdrop-filter: blur(8px); font-family: inherit; font-weight: 500;
  }
  .kamera button:hover { background: #111; color: #fff; }
  .kamera button[aria-pressed="true"] { background: #111; color: #fff; }

  /* Markører: farget skive med mørk ring, så punktene står fram
     mot det beige kartet. */
  .merke {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid #111;
    display: grid; place-items: center;
    font-size: 14px; line-height: 1; cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,.3);
    transition: transform .12s ease;
    text-shadow: 0 0 3px rgba(255,255,255,.95);
  }
  .merke:hover { transform: scale(1.32); }

  .maplibregl-popup-content {
    background: #fff; color: var(--tekst);
    border: 1.5px solid var(--kant); border-radius: 10px;
    padding: 12px 14px; font-size: 13px; line-height: 1.6;
    box-shadow: 0 6px 20px rgba(0,0,0,.18);
  }
  .maplibregl-popup-tip { border-top-color: #111 !important; border-bottom-color: #111 !important; }
  .maplibregl-popup-close-button { color: var(--dempet); font-size: 18px; padding: 2px 7px; }
  .maplibregl-popup-content b { display: block; font-size: 14px; margin-bottom: 4px; }
  .maplibregl-popup-content .rad { color: var(--dempet); }
  .maplibregl-popup-content .rad span { color: var(--tekst); }
  .maplibregl-ctrl-group { border: 1.5px solid var(--kant) !important; box-shadow: none !important; }

  .panel.naermest { left: auto; right: 16px; width: 280px; }
  .naermest .topp { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .naermest h2 { margin: 0; font-size: 16px; }
  .naermest .lukk { border: 0; background: none; font-size: 18px; cursor: pointer; color: var(--dempet); }
  .innslag { display: flex; gap: 9px; align-items: center; padding: 7px 8px; border-radius: 7px; cursor: pointer; }
  .innslag:hover { background: #f3f4f6; }
  .innslag .ikon { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #111; display: grid; place-items: center; font-size: 12px; flex: none; }
  .innslag .tekst { flex: 1; font-size: 13px; line-height: 1.35; min-width: 0; }
  .innslag .tekst small { display: block; color: var(--dempet); }
  .innslag .meter { font-size: 12px; font-variant-numeric: tabular-nums; }

  .tidslinje { position:absolute; bottom:24px; left:50%; transform:translateX(-50%); z-index:10; width:min(520px, calc(100% - 220px)); display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.95); border:1.5px solid var(--kant); border-radius:10px; padding:8px 12px; box-shadow:0 6px 20px rgba(0,0,0,.14); font-size:12px; }
  .tidslinje input { flex:1; accent-color:#111; }
  .tidslinje #tid-tekst { min-width:110px; text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
</style>
</head>
<body>
<div id="kart"></div>

<div class="panel">
  <h1>Oslo Live</h1>
  <p class="under">Levende data fra Allemannsdata</p>
  <div id="lagliste"><p class="tom">Laster lag …</p></div>
  <div class="bunn">
    <span id="oppdatert">–</span>
    <span id="sum">–</span>
  </div>
</div>

<div class="kamera">
  <button id="snurr" type="button" aria-pressed="false">Snurr</button>
  <button id="flatt" type="button">2D</button>
  <button id="hjem" type="button">Sentrum</button>
</div>

<div class="tidslinje">
  <span>−24 t</span>
  <input id="tid" type="range" min="-1440" max="0" step="15" value="0" aria-label="Tidslinje, siste døgn" aria-valuetext="Nå">
  <span id="tid-tekst">Nå</span>
</div>

<div class="panel naermest" id="naermest" hidden>
  <div class="topp"><h2>Nærmest her</h2><button class="lukk" id="lukk-naermest" type="button" aria-label="Lukk">×</button></div>
  <div id="naermest-liste"></div>
</div>

<script>
const SENTRUM = [10.7522, 59.9139];

const kart = new maplibregl.Map({
  container: 'kart',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: SENTRUM,
  zoom: 14.2,
  pitch: 55,
  bearing: -20,
  antialias: true,
  preserveDrawingBuffer: true,
  attributionControl: { compact: true }
});

kart.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');

kart.on('style.load', () => {
  varmTema(kart);
  start();
});

/**
 * Varmt tema: beige land, blaagroenn fjord, oransje hovedveier og bygninger
 * i 3D med terreng under. Samme uttrykk som Thomas Heggelunds Oslo-kart.
 *
 * Basiskartet er OpenFreeMap sin «liberty»-stil. Vi endrer bare farger paa
 * lagene som finnes der fra foer, og legger til terreng fra Mapterhorn.
 */
function varmTema(kart) {
  const S = (id, egenskap, verdi) => {
    if (!kart.getLayer(id)) return;
    try { kart.setPaintProperty(id, egenskap, verdi); } catch (e) { /* laget har ikke den egenskapen */ }
  };
  const skjul = (id) => { if (kart.getLayer(id)) kart.setLayoutProperty(id, 'visibility', 'none'); };

  const LAND = '#ede7d8', TEKST = '#4a4238', GLORIE = '#f4efe4';

  S('background', 'background-color', LAND);
  skjul('natural_earth');

  // Flater
  ['landuse_residential', 'landuse_hospital', 'landuse_school', 'aeroway_fill', 'road_area_pattern']
    .forEach((id) => S(id, 'fill-color', '#e6dfce'));
  ['park', 'landcover_grass', 'landuse_pitch', 'landuse_track', 'landuse_cemetery']
    .forEach((id) => S(id, 'fill-color', '#d3e0bf'));
  S('park', 'fill-opacity', 0.9);
  S('landcover_wood', 'fill-color', '#c6d7b0');
  S('landcover_wood', 'fill-opacity', 0.8);
  S('landcover_wetland', 'fill-opacity', 0.35);
  S('landcover_sand', 'fill-color', '#efe4c4');
  S('landcover_ice', 'fill-color', '#eef0ea');
  S('park_outline', 'line-color', '#bccaa6');

  // Vann
  S('water', 'fill-color', '#a9cdd6');
  ['waterway_river', 'waterway_other', 'waterway_tunnel']
    .forEach((id) => S(id, 'line-color', '#8fbcc8'));

  // Veier: oransje hovedveier, lyse smaaveier, brune kanter.
  kart.getStyle().layers.forEach((lag) => {
    if (lag.type !== 'line') return;
    const id = lag.id;
    const hoved = /motorway|trunk_primary|secondary_tertiary|_link/.test(id) && !/casing/.test(id);
    if (/_casing$/.test(id)) {
      S(id, 'line-color', /motorway|trunk_primary|secondary_tertiary|_link/.test(id) ? '#d08a48' : '#d6cbb5');
      S(id, 'line-opacity', 0.9);
    } else if (hoved && /^(road|bridge|tunnel)_/.test(id)) {
      S(id, 'line-color', '#eaa15c');
    } else if (/^(road|bridge|tunnel)_/.test(id) && !/rail|hatching|path_pedestrian/.test(id)) {
      S(id, 'line-color', '#faf6ec');
    } else if (/rail/.test(id)) {
      S(id, 'line-color', '#b3a894');
    } else if (/path_pedestrian/.test(id)) {
      S(id, 'line-color', '#e8dfca');
    } else if (/^boundary/.test(id)) {
      S(id, 'line-color', '#b3a894');
    }
  });

  // Bygninger: varm sandfarge med lys topp og moerkere vegger.
  S('building', 'fill-color', '#e2d7c0');
  S('building', 'fill-outline-color', '#cbbfa4');
  S('building-3d', 'fill-extrusion-color', '#e6dcc6');
  S('building-3d', 'fill-extrusion-opacity', 1);
  S('building-3d', 'fill-extrusion-vertical-gradient', true);

  // Tekst
  kart.getStyle().layers.forEach((lag) => {
    if (lag.type !== 'symbol') return;
    S(lag.id, 'text-color', TEKST);
    S(lag.id, 'text-halo-color', GLORIE);
    S(lag.id, 'text-halo-width', 1.4);
    S(lag.id, 'icon-opacity', 0.5);
  });

  // Rydd bort det som konkurrerer med vaare egne punkter.
  ['poi_r20', 'poi_r7', 'poi_r1', 'poi_transit',
   'road_one_way_arrow', 'road_one_way_arrow_opposite',
   'highway-shield-non-us', 'highway-shield-us-interstate', 'road_shield_us'
  ].forEach(skjul);

  // Terreng fra Mapterhorn (aapne hoeydedata, ingen noekkel), med skyggelegging
  // rett under bygningene saa aasene rundt byen faar form.
  if (!kart.getSource('terreng')) {
    kart.addSource('terreng', {
      type: 'raster-dem',
      tiles: ['https://tiles.mapterhorn.com/{z}/{x}/{y}.webp'],
      encoding: 'terrarium',
      tileSize: 512,
      maxzoom: 14,
      attribution: '<a href="https://mapterhorn.com/attribution">© Mapterhorn</a>'
    });
    kart.addLayer({
      id: 'terreng-skygge', type: 'hillshade', source: 'terreng',
      paint: {
        'hillshade-shadow-color': '#b9a784',
        'hillshade-highlight-color': '#fffdf6',
        'hillshade-accent-color': '#cdbd9c',
        'hillshade-exaggeration': 0.45
      }
    }, kart.getLayer('building') ? 'building' : undefined);
  }
  try { kart.setTerrain({ source: 'terreng', exaggeration: 1.3 }); } catch (e) { /* eldre maplibre */ }
  try {
    kart.setSky({
      'sky-color': '#cfe3ec', 'horizon-color': '#f1e9d6', 'fog-color': '#ede7d8',
      'sky-horizon-blend': 0.6, 'horizon-fog-blend': 0.7, 'fog-ground-blend': 0.5
    });
  } catch (e) { /* eldre maplibre */ }
}

// ---------------------------------------------------------------------------
// Farger per lag. Kjente lag har sin egen; resten faar en fra reservepaletten.
// ---------------------------------------------------------------------------
const FARGER = {
  kollektiv: '#e11d48',       // roed: bussene skal ses foerst
  fly: '#0f172a',             // naesten svart: flyene er hoeyt over alt annet
  skip: '#1d4ed8',
  mobilitet: '#16a34a',
  hendelser: '#ea580c',
  luftkvalitet: '#0d9488',
  badetemperatur: '#0891b2',
  trafikk: '#7c3aed',
  holdeplasser: '#be123c',
  veiarbeid: '#ca8a04',
  idrettsanlegg: '#65a30d',
  spisesteder: '#92400e',
  ladestasjoner: '#047857',
  smilefjes: '#f59e0b',
  kulturminner: '#78350f',
  arter: '#15803d'
};

const RESERVE = ['#dc2626', '#2563eb', '#059669', '#d97706',
                 '#7c3aed', '#0891b2', '#be185d', '#4d7c0f'];

function fargeFor(id, nr) {
  return FARGER[id] || RESERVE[nr % RESERVE.length];
}

// Punkter eller varmekart per lag, husket i localStorage.
const VARME_NOKKEL = 'oslolive.varmekart';
function lesVarmevalg() {
  try { return JSON.parse(localStorage.getItem(VARME_NOKKEL)) ?? {}; } catch (e) { return {}; }
}
function lagreVarmevalg() {
  const valg = {};
  for (const [id, l] of lagene) if (l.varme) valg[id] = true;
  try { localStorage.setItem(VARME_NOKKEL, JSON.stringify(valg)); } catch (e) { /* privat modus e.l. */ }
}

function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}

// ---------------------------------------------------------------------------
// Lagene
// ---------------------------------------------------------------------------
const lagene = new Map();

// Verdiene kommer fra eksterne kilder og går inn i innerHTML, så de må escapes.
function esc(v) {
  return String(v)
    .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;').replaceAll("'", '&#39;');
}

function popup(e) {
  const skjul = new Set(['id', 'navn', 'kilde']);
  const rader = Object.entries(e)
    .filter(([k, v]) => !skjul.has(k) && v !== null && v !== undefined && v !== '')
    .map(([k, v]) => `<div class="rad">${esc(k)}: <span>${esc(v)}</span></div>`)
    .join('');
  return `<b>${esc(e.navn ?? 'Uten navn')}</b>${rader}<div class="rad" style="margin-top:6px;opacity:.7">${esc(e.kilde ?? '')}</div>`;
}

let valgtTid = null;   // null = nå, ellers Date
let tidGenerasjon = 0;
let tidTimer = null;

function tidTekst(d) {
  return d ? d.toLocaleString('no-NO', { weekday: 'short', hour: '2-digit', minute: '2-digit' }) : 'Nå';
}

/** Viser markører eller varmekart for laget, ut fra på/av og valgt visning. */
function visLag(id) {
  const oppf = lagene.get(id);
  const markorerSynlige = oppf.på && !oppf.varme;
  for (const m of oppf.markorer) { if (markorerSynlige) { m.addTo(kart); } else { m.remove(); } }
  if (kart.getLayer('varme-' + id)) {
    kart.setLayoutProperty('varme-' + id, 'visibility', oppf.på && oppf.varme ? 'visible' : 'none');
  }
}

function varmekart(id, features) {
  const oppf = lagene.get(id);
  const data = { type: 'FeatureCollection', features };
  const kilde = kart.getSource('varme-' + id);
  if (kilde) { kilde.setData(data); return; }
  kart.addSource('varme-' + id, { type: 'geojson', data });
  kart.addLayer({
    id: 'varme-' + id, type: 'heatmap', source: 'varme-' + id,
    layout: { visibility: 'none' },
    paint: {
      'heatmap-weight': 1,
      'heatmap-intensity': ['interpolate', ['linear'], ['zoom'], 10, 1, 16, 3],
      'heatmap-radius': ['interpolate', ['linear'], ['zoom'], 10, 15, 16, 35],
      'heatmap-opacity': 0.8,
      'heatmap-color': ['interpolate', ['linear'], ['heatmap-density'],
        0, rgba(oppf.farge, 0), 0.2, rgba(oppf.farge, 0.25), 0.6, rgba(oppf.farge, 0.6), 1, rgba(oppf.farge, 0.95)]
    }
  });
}

async function hent(id) {
  const oppf = lagene.get(id);
  const teller = document.getElementById('antall-' + id);
  const gen = tidGenerasjon;
  try {
    const url = '/api/lag/' + id + (valgtTid ? '?tid=' + encodeURIComponent(valgtTid.toISOString()) : '');
    const svar = await fetch(url);
    if (!svar.ok) throw new Error('HTTP ' + svar.status);
    const geo = await svar.json();
    if (gen !== tidGenerasjon) return;   // et tregt svar fra en annen tid enn den valgte nå

    for (const m of oppf.markorer) m.remove();
    oppf.markorer = [];
    oppf.punkter = [];

    const gyldige = [];
    for (const f of (geo.features ?? [])) {
      const c = f.geometry?.coordinates;
      if (!Array.isArray(c) || c.length < 2) continue;

      const p = f.properties ?? {};
      const el = document.createElement('div');
      el.className = 'merke';
      el.style.background = p.advarsel ? '#b91c1c' : oppf.farge;
      el.textContent = p.advarsel ? '⚠️' : (p.ikon ?? oppf.ikon);

      const m = new maplibregl.Marker({ element: el })
        .setLngLat([c[0], c[1]])
        .setPopup(new maplibregl.Popup({ offset: 18, closeButton: true })
          .setHTML(popup(p)));

      if (oppf.på && !oppf.varme) m.addTo(kart);
      oppf.markorer.push(m);
      oppf.punkter.push({ markor: m, navn: f.properties?.navn ?? 'Uten navn', lon: c[0], lat: c[1] });
      gyldige.push({ type: 'Feature', geometry: { type: 'Point', coordinates: [c[0], c[1]] }, properties: {} });
    }

    varmekart(id, gyldige);
    visLag(id);

    oppf.antall = oppf.markorer.length;
    teller.textContent = oppf.antall;
    teller.className = 'antall ' + (oppf.antall ? 'ok' : '');
  } catch (e) {
    if (gen !== tidGenerasjon) return;
    oppf.antall = 0;
    teller.textContent = 'feil';
    teller.className = 'antall feil';
  }
  oppdaterBunn();
  if (valgtSted) visNaermest();
}

function oppdaterBunn() {
  let sum = 0;
  for (const l of lagene.values()) if (l.på) sum += l.antall;
  document.getElementById('sum').textContent = sum + ' punkter';
  document.getElementById('oppdatert').textContent = valgtTid ? 'Viser ' + tidTekst(valgtTid) : new Date().toLocaleTimeString('no-NO');
}

document.getElementById('tid').addEventListener('input', (ev) => {
  const min = Number(ev.target.value);
  const d = min === 0 ? null : new Date(Date.now() + min * 60000);
  document.getElementById('tid-tekst').textContent = tidTekst(d);
  ev.target.setAttribute('aria-valuetext', tidTekst(d));

  clearTimeout(tidTimer);
  tidTimer = setTimeout(() => {
    valgtTid = d;
    tidGenerasjon++;
    lagene.forEach((_, id) => hent(id));
  }, 250);
});

async function start() {
  let lag = [];
  try {
    lag = await (await fetch('/api/lag')).json();
  } catch (e) { /* håndteres under */ }

  const liste = document.getElementById('lagliste');

  if (!lag.length) {
    liste.innerHTML = '<p class="tom">Ingen lag registrert ennå. Løs en issue, så dukker de opp her.</p>';
    return;
  }

  liste.innerHTML = '';
  const varmevalg = lesVarmevalg();
  lag.forEach((l, nr) => {
    const farge = fargeFor(l.id, nr);
    lagene.set(l.id, { ikon: l.ikon || '📍', navn: l.navn, farge, markorer: [], punkter: [], antall: 0, på: true, varme: !!varmevalg[l.id] });

    const rad = document.createElement('label');
    rad.className = 'lag';
    rad.title = l.beskrivelse ?? '';
    rad.innerHTML =
      `<input type="checkbox" checked>` +
      `<span class="prikk" style="background:${farge}"></span>` +
      `<span class="navn">${l.navn}</span>` +
      `<span class="antall" id="antall-${l.id}">…</span>` +
      `<button type="button" class="visning" aria-pressed="${!!varmevalg[l.id]}" title="Bytt mellom punkter og varmekart">${varmevalg[l.id] ? 'Varme' : 'Punkter'}</button>`;

    rad.querySelector('input').addEventListener('change', (ev) => {
      const oppf = lagene.get(l.id);
      oppf.på = ev.target.checked;
      visLag(l.id);
      oppdaterBunn();
      if (valgtSted) visNaermest();
    });
    rad.querySelector('.visning').addEventListener('click', (ev) => {
      ev.preventDefault(); ev.stopPropagation();
      const oppf = lagene.get(l.id);
      oppf.varme = !oppf.varme;
      ev.currentTarget.setAttribute('aria-pressed', String(oppf.varme));
      ev.currentTarget.textContent = oppf.varme ? 'Varme' : 'Punkter';
      lagreVarmevalg();
      visLag(l.id);
    });
    liste.appendChild(rad);

    hent(l.id);
  });

  setInterval(() => { if (valgtTid) return; lagene.forEach((_, id) => hent(id)); }, 15000);
}

// ---------------------------------------------------------------------------
// Nærmest her: høyreklikk eller langt trykk
// ---------------------------------------------------------------------------
let valgtSted = null;   // { lng, lat }
let stedMarkor = null;

/** Samme haversine som Geo.Avstand i Kart/Geo.cs. Meter. */
function avstand(lat1, lon1, lat2, lon2) {
  const rad = (g) => g * Math.PI / 180;
  const dLat = rad(lat2 - lat1), dLon = rad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.min(1, Math.sqrt(a)));
}

function velgSted(lngLat) {
  valgtSted = { lng: lngLat.lng, lat: lngLat.lat };
  if (!stedMarkor) stedMarkor = new maplibregl.Marker({ color: '#111' });
  stedMarkor.setLngLat(lngLat).addTo(kart);
  visNaermest();
}

function visNaermest() {
  const innslag = [];
  for (const oppf of lagene.values()) {
    if (!oppf.på || !oppf.punkter.length) continue;          // lag uten punkter vises ikke
    let best = null;
    for (const p of oppf.punkter) {
      const d = avstand(valgtSted.lat, valgtSted.lng, p.lat, p.lon);
      if (!best || d < best.d) best = { ...p, d };
    }
    innslag.push({ oppf, best });
  }
  innslag.sort((a, b) => a.best.d - b.best.d);               // korteste øverst

  const liste = document.getElementById('naermest-liste');
  liste.innerHTML = '';
  if (!innslag.length) liste.innerHTML = '<p class="tom">Ingen punkter i lagene som er på.</p>';
  for (const { oppf, best } of innslag) {
    const rad = document.createElement('div');
    rad.className = 'innslag';
    rad.innerHTML = '<span class="ikon"></span><span class="tekst"><span class="punkt"></span><small class="lagnavn"></small></span><span class="meter"></span>';
    rad.querySelector('.ikon').textContent = oppf.ikon;
    rad.querySelector('.ikon').style.background = oppf.farge;
    rad.querySelector('.punkt').textContent = best.navn;      // textContent: navn kommer fra eksterne kilder
    rad.querySelector('.lagnavn').textContent = oppf.navn;
    rad.querySelector('.meter').textContent = Math.round(best.d) + ' m';
    rad.addEventListener('click', () => {
      kart.flyTo({ center: [best.lon, best.lat], zoom: Math.max(kart.getZoom(), 16), duration: 1200 });
      const popup = best.markor.getPopup();
      if (popup && !popup.isOpen()) {
        if (oppf.på && !oppf.varme) { best.markor.togglePopup(); } else { popup.setLngLat([best.lon, best.lat]).addTo(kart); }
      }
    });
    liste.appendChild(rad);
  }
  document.getElementById('naermest').hidden = false;
}

function lukkNaermest() {
  valgtSted = null;
  if (stedMarkor) stedMarkor.remove();
  document.getElementById('naermest').hidden = true;
}

document.getElementById('lukk-naermest').addEventListener('click', lukkNaermest);

kart.on('contextmenu', (e) => { e.preventDefault(); velgSted(e.lngLat); });

// Langt trykk: MapLibre har ingen egen hendelse for dette, og iOS sender ikke contextmenu.
let trykkTimer = null, trykkStart = null;
kart.on('touchstart', (e) => {
  clearTimeout(trykkTimer);
  if (e.originalEvent.touches.length !== 1) return;          // ikke ved knip/zoom
  trykkStart = e.point;
  trykkTimer = setTimeout(() => velgSted(e.lngLat), 600);
});
kart.on('touchmove', (e) => {
  if (trykkStart && (Math.abs(e.point.x - trykkStart.x) > 10 || Math.abs(e.point.y - trykkStart.y) > 10)) clearTimeout(trykkTimer);
});
['touchend', 'touchcancel', 'dragstart', 'zoomstart'].forEach((h) => kart.on(h, () => clearTimeout(trykkTimer)));

// ---------------------------------------------------------------------------
// Kamera
// ---------------------------------------------------------------------------
let snurrer = false;
let snurrId = null;

function snurrSteg() {
  if (!snurrer) return;
  kart.setBearing(kart.getBearing() + 0.08);
  snurrId = requestAnimationFrame(snurrSteg);
}

document.getElementById('snurr').addEventListener('click', (ev) => {
  snurrer = !snurrer;
  ev.currentTarget.setAttribute('aria-pressed', String(snurrer));
  if (snurrer) { snurrSteg(); } else if (snurrId) { cancelAnimationFrame(snurrId); }
});

document.getElementById('flatt').addEventListener('click', (ev) => {
  const erTiltet = kart.getPitch() > 10;
  kart.easeTo({ pitch: erTiltet ? 0 : 55, bearing: erTiltet ? 0 : -20, duration: 900 });
  ev.currentTarget.textContent = erTiltet ? '3D' : '2D';
});

document.getElementById('hjem').addEventListener('click', () => {
  kart.flyTo({ center: SENTRUM, zoom: 14.2, pitch: 55, bearing: -20, duration: 1600 });
});

kart.on('mousedown', () => {
  if (snurrer) {
    snurrer = false;
    document.getElementById('snurr').setAttribute('aria-pressed', 'false');
  }
});
</script>
