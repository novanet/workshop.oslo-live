<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oslo Live</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --kant: #30363d;
    --tekst: #e6edf3; --dempet: #8b949e; --aksent: #2f81f7; --ok: #3fb950; --feil: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--tekst); }
  #kart { position: absolute; inset: 0; background: var(--bg); }

  .panel {
    position: absolute; top: 16px; left: 16px; z-index: 10; width: 300px;
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    border: 1px solid var(--kant); border-radius: 12px;
    padding: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.6);
    backdrop-filter: blur(10px);
    max-height: calc(100% - 32px); overflow-y: auto;
  }
  .panel h1 { margin: 0 0 2px; font-size: 20px; letter-spacing: -.02em; }
  .panel .under { margin: 0 0 14px; font-size: 12px; color: var(--dempet); }
  .lag { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .lag:hover { background: rgba(255,255,255,.05); }
  .lag input { accent-color: var(--aksent); width: 16px; height: 16px; cursor: pointer; }
  .lag .ikon { font-size: 17px; width: 22px; text-align: center; }
  .lag .navn { flex: 1; font-size: 14px; }
  .lag .antall { font-size: 12px; color: var(--dempet); font-variant-numeric: tabular-nums; }
  .lag .antall.feil { color: var(--feil); }
  .lag .antall.ok { color: var(--ok); }
  .tom { font-size: 13px; color: var(--dempet); line-height: 1.5; padding: 4px 2px; }
  .bunn { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--kant); font-size: 11px; color: var(--dempet); display: flex; justify-content: space-between; }

  /* Kameraknapper */
  .kamera {
    position: absolute; bottom: 24px; right: 16px; z-index: 10;
    display: flex; flex-direction: column; gap: 6px;
  }
  .kamera button {
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    border: 1px solid var(--kant); color: var(--tekst);
    border-radius: 8px; padding: 8px 12px; font-size: 12px; cursor: pointer;
    backdrop-filter: blur(10px); font-family: inherit;
  }
  .kamera button:hover { border-color: var(--aksent); color: var(--aksent); }
  .kamera button[aria-pressed="true"] { border-color: var(--aksent); color: var(--aksent); }

  /* Markører */
  .merke {
    font-size: 22px; line-height: 1; cursor: pointer;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,.9));
    transition: transform .12s ease;
  }
  .merke:hover { transform: scale(1.35); }

  .maplibregl-popup-content {
    background: var(--panel); color: var(--tekst);
    border: 1px solid var(--kant); border-radius: 10px;
    padding: 12px 14px; font-size: 13px; line-height: 1.6;
    box-shadow: 0 8px 28px rgba(0,0,0,.6);
  }
  .maplibregl-popup-tip { border-top-color: var(--panel) !important; border-bottom-color: var(--panel) !important; }
  .maplibregl-popup-close-button { color: var(--dempet); font-size: 18px; padding: 2px 7px; }
  .maplibregl-popup-content b { display: block; font-size: 14px; margin-bottom: 4px; }
  .maplibregl-popup-content .rad { color: var(--dempet); }
  .maplibregl-popup-content .rad span { color: var(--tekst); }
  .maplibregl-ctrl-group { background: var(--panel) !important; border: 1px solid var(--kant); }
  .maplibregl-ctrl-group button { background: transparent !important; }
  .maplibregl-ctrl-group button span { filter: invert(1); }
</style>
</head>
<body>
<div id="kart"></div>

<div class="panel">
  <h1>Oslo Live</h1>
  <p class="under">Levende data fra Allemannsdata</p>
  <div id="lagliste"><p class="tom">Laster lag …</p></div>
  <div class="bunn">
    <span id="oppdatert">–</span>
    <span id="sum">–</span>
  </div>
</div>

<div class="kamera">
  <button id="snurr" type="button" aria-pressed="false">Snurr</button>
  <button id="flatt" type="button">2D</button>
  <button id="hjem" type="button">Sentrum</button>
</div>

<script>
const SENTRUM = [10.7522, 59.9139];

const kart = new maplibregl.Map({
  container: 'kart',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: SENTRUM,
  zoom: 14.2,
  pitch: 58,        // tittet kamera: det er dette som gjør bygningene synlige
  bearing: -22,
  antialias: true,
  preserveDrawingBuffer: true,   // lar deg ta skjermbilde av kartet til slides
  attributionControl: { compact: true }
});

kart.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');

kart.on('style.load', () => {
  // Mørkere underlag, så datapunktene er det som lyser.
  for (const lag of kart.getStyle().layers) {
    if (lag.type === 'background') {
      kart.setPaintProperty(lag.id, 'background-color', '#11161d');
    } else if (lag.type === 'fill' && /water/.test(lag.id)) {
      kart.setPaintProperty(lag.id, 'fill-color', '#0b1a2b');
    } else if (lag.type === 'fill' && /land|earth|park|wood|grass/.test(lag.id)) {
      kart.setPaintProperty(lag.id, 'fill-color', '#161c24');
    } else if (lag.type === 'symbol') {
      try {
        kart.setPaintProperty(lag.id, 'text-color', '#7d8794');
        kart.setPaintProperty(lag.id, 'text-halo-color', '#0d1117');
      } catch (e) { /* ikke alle symbollag har tekst */ }
    } else if (lag.type === 'line' && /road|transportation|bridge/.test(lag.id)) {
      try { kart.setPaintProperty(lag.id, 'line-color', '#28303b'); } catch (e) {}
    }
  }

  // Bygningene i tre dimensjoner. Stilen har allerede laget, vi gir det farge.
  if (kart.getLayer('building-3d')) {
    kart.setPaintProperty('building-3d', 'fill-extrusion-color', '#1e2732');
    kart.setPaintProperty('building-3d', 'fill-extrusion-opacity', 0.92);
    kart.setPaintProperty('building-3d', 'fill-extrusion-vertical-gradient', true);
  }

  // Litt dis i horisonten gir dybde uten å skjule noe.
  try {
    kart.setFog({ range: [1, 12], color: '#0d1117', 'horizon-blend': 0.3 });
  } catch (e) { /* eldre maplibre */ }

  start();
});

// ---------------------------------------------------------------------------
// Lagene
// ---------------------------------------------------------------------------
const lagene = new Map();

function popup(e) {
  const skjul = new Set(['id', 'navn', 'kilde']);
  const rader = Object.entries(e)
    .filter(([k, v]) => !skjul.has(k) && v !== null && v !== undefined && v !== '')
    .map(([k, v]) => `<div class="rad">${k}: <span>${v}</span></div>`)
    .join('');
  return `<b>${e.navn ?? 'Uten navn'}</b>${rader}<div class="rad" style="margin-top:6px;opacity:.7">${e.kilde ?? ''}</div>`;
}

async function hent(id) {
  const oppf = lagene.get(id);
  const teller = document.getElementById('antall-' + id);
  try {
    const svar = await fetch('/api/lag/' + id);
    if (!svar.ok) throw new Error('HTTP ' + svar.status);
    const geo = await svar.json();

    for (const m of oppf.markorer) m.remove();
    oppf.markorer = [];

    for (const f of (geo.features ?? [])) {
      const c = f.geometry?.coordinates;
      if (!Array.isArray(c) || c.length < 2) continue;

      const el = document.createElement('div');
      el.className = 'merke';
      el.textContent = oppf.ikon;

      const m = new maplibregl.Marker({ element: el })
        .setLngLat([c[0], c[1]])
        .setPopup(new maplibregl.Popup({ offset: 16, closeButton: true })
          .setHTML(popup(f.properties ?? {})));

      if (oppf.på) m.addTo(kart);
      oppf.markorer.push(m);
    }

    oppf.antall = oppf.markorer.length;
    teller.textContent = oppf.antall;
    teller.className = 'antall ' + (oppf.antall ? 'ok' : '');
  } catch (e) {
    oppf.antall = 0;
    teller.textContent = 'feil';
    teller.className = 'antall feil';
  }
  oppdaterBunn();
}

function oppdaterBunn() {
  let sum = 0;
  for (const l of lagene.values()) if (l.på) sum += l.antall;
  document.getElementById('sum').textContent = sum + ' punkter';
  document.getElementById('oppdatert').textContent = new Date().toLocaleTimeString('no-NO');
}

async function start() {
  let lag = [];
  try {
    lag = await (await fetch('/api/lag')).json();
  } catch (e) { /* vises under */ }

  const liste = document.getElementById('lagliste');

  if (!lag.length) {
    liste.innerHTML = '<p class="tom">Ingen lag registrert ennå. Løs en issue, så dukker de opp her.</p>';
    return;
  }

  liste.innerHTML = '';
  for (const l of lag) {
    lagene.set(l.id, { ikon: l.ikon || '📍', markorer: [], antall: 0, på: true });

    const rad = document.createElement('label');
    rad.className = 'lag';
    rad.title = l.beskrivelse ?? '';
    rad.innerHTML = `<input type="checkbox" checked><span class="ikon">${l.ikon || '📍'}</span>
                     <span class="navn">${l.navn}</span><span class="antall" id="antall-${l.id}">…</span>`;
    rad.querySelector('input').addEventListener('change', ev => {
      const oppf = lagene.get(l.id);
      oppf.på = ev.target.checked;
      for (const m of oppf.markorer) {
        if (oppf.på) { m.addTo(kart); } else { m.remove(); }
      }
      oppdaterBunn();
    });
    liste.appendChild(rad);

    hent(l.id);
  }

  setInterval(() => lagene.forEach((_, id) => hent(id)), 15000);
}

// ---------------------------------------------------------------------------
// Kamera
// ---------------------------------------------------------------------------
let snurrer = false;
let snurrId = null;

function snurrSteg() {
  if (!snurrer) return;
  kart.setBearing(kart.getBearing() + 0.08);
  snurrId = requestAnimationFrame(snurrSteg);
}

document.getElementById('snurr').addEventListener('click', ev => {
  snurrer = !snurrer;
  ev.currentTarget.setAttribute('aria-pressed', String(snurrer));
  if (snurrer) { snurrSteg(); } else if (snurrId) { cancelAnimationFrame(snurrId); }
});

document.getElementById('flatt').addEventListener('click', ev => {
  const flatt = kart.getPitch() > 10;
  kart.easeTo({ pitch: flatt ? 0 : 58, bearing: flatt ? 0 : -22, duration: 900 });
  ev.currentTarget.textContent = flatt ? '3D' : '2D';
});

document.getElementById('hjem').addEventListener('click', () => {
  kart.flyTo({ center: SENTRUM, zoom: 14.2, pitch: 58, bearing: -22, duration: 1600 });
});

// Stopp snurringen når noen tar tak i kartet selv.
kart.on('mousedown', () => {
  if (snurrer) {
    snurrer = false;
    document.getElementById('snurr').setAttribute('aria-pressed', 'false');
  }
});
</script>
</body>
</html>
