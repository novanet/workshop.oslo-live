<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #F6F8F5;
    --surface: #FFFFFF;
    --ink: #17231F;
    --muted: #5A6A64;
    --line: #D6DDD8;
    --accent: #0E6D69;
    --accent-soft: #E1F0EE;
    --gull: #B97F0E;
    --gull-soft: #F7EBCF;
    --warn: #A33A2C;
    --warn-soft: #F8E4E0;
    --ok: #2E7D47;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0F1715; --surface: #16201D; --ink: #E4EBE7; --muted: #93A39D;
      --line: #27332F; --accent: #43B5AE; --accent-soft: #14302E;
      --gull: #E2A83B; --gull-soft: #33280F; --warn: #E07A6A; --warn-soft: #3A1B16;
      --ok: #4FC172;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0F1715; --surface: #16201D; --ink: #E4EBE7; --muted: #93A39D;
    --line: #27332F; --accent: #43B5AE; --accent-soft: #14302E;
    --gull: #E2A83B; --gull-soft: #33280F; --warn: #E07A6A; --warn-soft: #3A1B16;
    --ok: #4FC172;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    font-size: 16px; line-height: 1.45;
  }
  .ramme { padding: clamp(16px, 2.6vw, 34px); padding-block: clamp(16px, 2.6vw, 34px); max-width: 1600px; margin: 0 auto; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 18px; }
  .merkelapp {
    font-family: "IBM Plex Mono", monospace; font-size: 12px;
    letter-spacing: .15em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px;
  }
  h1 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 700;
    font-size: clamp(30px, 4.4vw, 54px); line-height: 1; letter-spacing: -.025em; margin: 0;
  }
  .status { text-align: right; font-family: "IBM Plex Mono", monospace; font-size: 14px; color: var(--muted); }
  .status .puls { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 7px; }
  .navigasjon { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 10px; }
  .navigasjon a {
    color: var(--accent); background: var(--accent-soft); border-radius: 999px;
    padding: 5px 11px; text-decoration: none; font-size: 12px;
  }
  .navigasjon a:hover { text-decoration: underline; }
  @media (prefers-reduced-motion: no-preference) {
    .status .puls { animation: blink 2.4s ease-in-out infinite; }
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  .rull { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 820px; }
  thead th {
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted); font-weight: 600;
    text-align: left; padding: 0 12px 7px 0; white-space: nowrap;
  }
  thead th.h { text-align: right; padding-right: 0; }
  tbody tr { background: var(--surface); }
  tbody td {
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding: 6px 14px 6px 0; vertical-align: middle;
  }
  tbody td:first-child { border-left: 1px solid var(--line); border-radius: 10px 0 0 10px; padding-left: 13px; }
  tbody td.h { text-align: right; }
  tbody td:last-child { border-right: 1px solid var(--line); border-radius: 0 10px 10px 0; padding-right: 13px; text-align: right; }
  tbody tr.mellom { background: transparent; }
  tbody tr.mellom td { border: 0; padding: 0; height: 4px; background: transparent; }

  .plass {
    font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 700;
    font-size: clamp(18px, 1.8vw, 24px); color: var(--muted);
    font-variant-numeric: tabular-nums; width: 1%; white-space: nowrap;
  }
  tr.topp .plass { color: var(--gull); }
  tr.topp td:first-child { box-shadow: inset 3px 0 0 var(--gull); }

  .navn { font-weight: 600; font-size: clamp(16px, 1.5vw, 19px); display: inline; margin-right: 10px; }
  .repo { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--muted); display: inline; white-space: nowrap; }

  .poeng {
    font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 700;
    font-size: clamp(22px, 2.2vw, 30px); line-height: 1; color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .poeng.negativ { color: var(--warn); }

  .merker { display: flex; flex-wrap: wrap; gap: 6px; }
  .merke {
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px;
    padding: 2px 7px; border-radius: 999px; white-space: nowrap;
    background: var(--accent-soft); color: var(--accent); border: 1px solid transparent;
  }
  .merke.lag { background: transparent; border-color: var(--line); color: var(--muted); }
  .merke b { font-weight: 600; margin-left: 3px; color: var(--ink); }
  .merke.ingen { background: transparent; border-color: var(--line); color: var(--muted); font-style: italic; }
  .merke.brakk { background: var(--warn-soft); color: var(--warn); }
  .merke.fikset { background: var(--gull-soft); color: var(--gull); }

  .tall { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-size: 15px; }
  .tall.dyrt { color: var(--warn); }
  .under { display: inline; margin-left: 8px; font-size: 12px; color: var(--muted); font-family: "IBM Plex Sans", sans-serif; white-space: nowrap; }

  .pille {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: "IBM Plex Mono", monospace; font-size: 12px;
    padding: 4px 10px; border-radius: 999px;
  }
  .pille.groenn { background: var(--accent-soft); color: var(--ok); }
  .pille.roed { background: var(--warn-soft); color: var(--warn); }
  .prikk { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .beskjed {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 34px; color: var(--muted); text-align: center;
  }
  .feil { color: var(--warn); font-size: 12.5px; margin-top: 5px; font-family: "IBM Plex Mono", monospace; }

  .framdrift {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 16px; margin-bottom: 14px;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  }
  .framdrift .tekst { font-size: 15px; color: var(--muted); }
  .framdrift .tekst b { color: var(--ink); font-size: 19px; font-family: "IBM Plex Mono", monospace; }
  .stripe { flex: 1; min-width: 200px; height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .stripe i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .6s ease; }
  .framdrift .repo { font-size: 12.5px; }

  .kjoerer { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .kjoerer .tittel { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
  .kjoering {
    display: inline-flex; align-items: center; gap: 9px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 14px 7px 11px; font-size: 14.5px;
  }
  .kjoering .prikk { width: 8px; height: 8px; background: var(--ok); }
  @media (prefers-reduced-motion: no-preference) { .kjoering .prikk { animation: blink 1.6s ease-in-out infinite; } }
  .kjoering b { font-weight: 600; }
  .kjoering .hva { color: var(--muted); }
  .kjoering .tid { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); }
  .tildelt .kjoering .prikk { background: var(--gull); }

  .live-grid {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px; margin-bottom: 14px;
  }
  .live-panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; min-width: 0;
  }
  .live-topp {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    margin-bottom: 8px;
  }
  .live-tittel {
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted);
  }
  .live-antall {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--muted);
    white-space: nowrap;
  }
  .live-liste {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px;
    max-height: min(36vh, 360px); overflow-y: auto; padding-right: 3px;
  }
  .live-rad {
    border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px;
    min-width: 0;
  }
  .live-rad a { color: var(--accent); text-decoration: none; }
  .live-rad a:hover { text-decoration: underline; }
  .live-navn { font-weight: 600; overflow-wrap: anywhere; }
  .live-meta {
    color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 10.5px;
    margin-top: 3px;
  }
  .live-merker { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .live-merke {
    background: var(--accent-soft); color: var(--accent); border-radius: 999px;
    font-family: "IBM Plex Mono", monospace; font-size: 10px; padding: 1px 6px;
  }
  .live-merke.utkast { background: var(--warn-soft); color: var(--warn); }
  .live-tom { color: var(--muted); font-size: 13px; }
  @media (max-width: 720px) {
    .live-grid { grid-template-columns: 1fr; }
  }

  /* Storskjerm: ?poeng viser bare framdrift og poengtavla, med større rader. */
  body.bare-poeng .live-grid, body.bare-poeng #kjoerer, body.bare-poeng .navigasjon { display: none; }
  body.bare-poeng header h1 { font-size: clamp(26px, 3vw, 40px); }
  body.bare-poeng tbody tr:not(.mellom) td { padding-top: 5px; padding-bottom: 5px; }
  body.bare-poeng tbody tr.mellom td { height: 3px; }
  body.bare-poeng header { margin-bottom: 8px; }
  body.bare-poeng .merkelapp { display: none; }
  body.bare-poeng .navn { font-size: clamp(17px, 1.4vw, 21px); }
  body.bare-poeng .poeng { font-size: clamp(20px, 1.9vw, 26px); }
  body.bare-poeng .plass { font-size: clamp(17px, 1.5vw, 21px); }

  .score-topp {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    margin: 6px 0 9px;
  }
  .score-topp h2 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 22px;
    line-height: 1; margin: 0;
  }
  .score-topp span { color: var(--muted); font-size: 13px; }

  footer {
    margin-top: 26px; display: flex; gap: 10px; flex-wrap: wrap;
    font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--muted);
  }
  footer span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 13px; }
</style>
</head>
<body>
<div class="ramme">

  <header>
    <div>
      <p class="merkelapp">Bygg din egen kodeagent,</p>
      <h1>Status</h1>
    </div>
    <div class="status">
      <div><span class="puls"></span><span id="oppdatert">laster …</span></div>
      <div id="neste"></div>
      <nav class="navigasjon" aria-label="Kursressurser">
        <a href="presentasjon.html">Presentasjon</a>
        <a href="prerequisites.html">Prerequisites</a>
        <a href="lab1.html">Lab 1</a>
        <a href="lab2.html">Lab 2</a>
        <a href="lab3.html">Lab 3</a>
        <a href="teknisk.html">Teknisk</a>
        <a href="https://ca-oslolive.thankfulwave-6bdee498.norwayeast.azurecontainerapps.io/" target="_blank" rel="noopener">Oslo Live</a>
      </nav>
    </div>
  </header>

  <div id="framdrift"></div>
  <div class="live-grid">
    <section id="tildelt" aria-live="polite"></section>
    <section id="aapne" aria-live="polite"></section>
  </div>
  <div id="kjoerer"></div>

  <div id="innhold">
    <div class="beskjed">Leser <span class="repo">resultat.json</span> …</div>
  </div>

  <footer id="regler"></footer>

</div>

<script>
  try {
    if (/(^|[?&])poeng(=|&|$)/.test(location.search.slice(1))) document.body.classList.add('bare-poeng');
  } catch (e) { /* vis full side */ }

(function () {
  var HENT_HVERT = 15000;

  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function klokke(iso) {
    if (!iso) return '–';
    var d = new Date(iso);
    return isNaN(d) ? '–' : d.toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function issueUrl(repo, nr) {
    return 'https://github.com/' + encodeURI(repo || '') + '/issues/' + encodeURIComponent(nr);
  }

  function prUrl(repo, nr) {
    return 'https://github.com/' + encodeURI(repo || '') + '/pull/' + encodeURIComponent(nr);
  }

  // Poeng per dollar. Kostnaden regnes som minst 1 cent, og uten poeng er forholdet 0.
  function perDollar(d) {
    var p = d.poeng || 0;
    if (!p) return 0;
    return p / Math.max(d.dollar || 0, 0.01);
  }

  function sorterPerDollar(folk) {
    return folk.slice().sort(function (a, b) {
      return (perDollar(b) - perDollar(a)) || ((b.poeng || 0) - (a.poeng || 0)) || ((a.dollar || 0) - (b.dollar || 0));
    }).map(function (d, i) {
      var kopi = {};
      for (var k in d) kopi[k] = d[k];
      kopi.plass = i + 1;
      return kopi;
    });
  }

  function rad(d) {
    var merker = [];
    function merke(x, klasse) {
      var p = x.poeng != null ? ' <b>' + x.poeng + '</b>' : '';
      return '<span class="merke' + klasse + '">#' + x.issue + ' ' + esc(x.navn) + p + '</span>';
    }
    (d.feil || []).forEach(function (f) { merker.push(merke(f, '')); });
    (d.lag || []).forEach(function (l) { merker.push(merke(l, ' lag')); });
    (d.levert || []).forEach(function (l) { merker.push(merke(l, ' lag')); });
    (d.bygg || []).forEach(function (b) {
      merker.push('<span class="merke ' + b.type + '">' + (b.type === 'brakk' ? 'brakk main' : 'fikset main') +
        (b.pr ? ' #' + b.pr : '') + ' <b>' + (b.poeng > 0 ? '+' : '') + b.poeng + '</b></span>');
    });
    if (d.utkast) merker.push('<span class="merke brakk">' + d.utkast + ' PR bygger ikke</span>');
    if (!merker.length) merker.push('<span class="merke ingen">ingenting ennå</span>');

    var dyrt = (d.dollar || 0) >= 5 ? ' dyrt' : '';

    return '' +
      '<tr class="' + (d.plass === 1 && perDollar(d) > 0 ? 'topp' : '') + '">' +
        '<td class="plass">' + d.plass + '</td>' +
        '<td><div class="navn">' + esc(d.navn) + '</div>' +
            '<div class="repo">' + (d.github && d.github !== d.navn ? esc(d.github) + ' · ' : '') + (d.merget || 0) + ' merget av ' + (d.pr || 0) + ' PR</div></td>' +
        '<td><div class="merker">' + merker.join('') + '</div></td>' +
        '<td><span class="tall' + dyrt + '"' + (d.estimert ? ' title="Deler av kostnaden er beregnet fra tokens og listepris"' : '') + '>' + (d.estimert ? '~' : '') + '$' + (d.dollar || 0).toFixed(2) + '</span>' +
            '<span class="under">' + Math.round((d.tokens || 0) / 1000) + 'k tokens' +
            (d.utenPr ? ' · ' + d.utenPr + ' uten PR' : '') + '</span></td>' +
        '<td class="h"><span class="tall">' + d.poeng + '</span></td>' +
        '<td><span class="poeng' + (d.poeng < 0 ? ' negativ' : '') + '">' + perDollar(d).toFixed(1) + '</span></td>' +
      '</tr>' +
      '<tr class="mellom"><td colspan="6"></td></tr>';
  }

  function tegnFramdrift(data) {
    var pr = data.produkt || {};
    var lost = (pr.issuerLost || []).length;
    var alle = pr.antallIssuer || 25;
    var andel = alle ? Math.round((lost / alle) * 100) : 0;

    document.getElementById('framdrift').innerHTML =
      '<div class="framdrift">' +
        '<span class="tekst"><b>' + lost + '</b> av ' + alle + ' issuer løst</span>' +
        '<span class="stripe"><i style="width:' + andel + '%"></i></span>' +
        '<span class="repo">' + esc(data.repo || '') + '</span>' +
        (data.main ? (data.main.groent
            ? '<span class="pille groenn"><span class="prikk"></span>main er grønn</span>'
            : '<span class="pille roed"><span class="prikk"></span>main er rød siden ' + klokke(data.main.siden) +
              (data.main.pr ? ' (#' + data.main.pr + ')' : '') + '</span>') : '') +
        (pr.feilmelding ? '<span class="feil">' + esc(pr.feilmelding).slice(0, 120) + '</span>' : '') +
      '</div>';
  }

  function tegnKjoerer(data) {
    var liste = data.kjoerer || [];
    var el = document.getElementById('kjoerer');
    if (!liste.length) { el.innerHTML = ''; return; }
    el.innerHTML = '<div class="kjoerer"><span class="tittel">Kjører nå</span>' +
      liste.map(function (k) {
        return '<span class="kjoering"><span class="prikk"></span><b>' + esc(k.agent) + '</b>' +
          '<span class="hva">#' + k.issue + ' ' + esc(k.navn || '') + '</span>' +
          '<span class="tid">' + (k.minutter || 0) + ' min</span></span>';
      }).join('') + '</div>';
  }

  function tegnTildelt(data) {
    var liste = data.tildelt || [];
    var el = document.getElementById('tildelt');
    el.innerHTML = '<div class="live-panel">' +
      '<div class="live-topp"><span class="live-tittel">Tildelte issues</span>' +
      '<span class="live-antall">' + liste.length + '</span></div>' +
      (liste.length
        ? '<div class="live-liste">' + liste.map(function (k) {
            return '<div class="live-rad">' +
              '<div class="live-navn"><a href="' + issueUrl(data.repo, k.issue) + '" target="_blank" rel="noopener">#' +
                k.issue + ' ' + esc(k.navn || '') + '</a></div>' +
              '<div class="live-meta">tildelt til @' + esc(k.github || 'ukjent') +
                (k.oppdatert ? ' · oppdatert ' + klokke(k.oppdatert) : '') + '</div>' +
              '</div>';
          }).join('') + '</div>'
        : '<div class="live-tom">Ingen åpne issues er tildelt akkurat nå.</div>') +
      '</div>';
  }

  function tegnAapne(data) {
    var liste = data.aapne || [];
    var el = document.getElementById('aapne');
    el.innerHTML = '<div class="live-panel">' +
      '<div class="live-topp"><span class="live-tittel">Åpne pull requests</span>' +
      '<span class="live-antall">' + liste.length + '</span></div>' +
      (liste.length
        ? '<div class="live-liste">' + liste.map(function (p) {
            var agent = p.agent || p.github || 'ukjent';
            var issues = (p.issues || []).map(function (nr) {
              return '<a class="live-merke" href="' + issueUrl(data.repo, nr) +
                '" target="_blank" rel="noopener">#' + nr + '</a>';
            }).join('');
            return '<div class="live-rad">' +
              '<div class="live-navn"><a href="' + prUrl(data.repo, p.pr) +
                '" target="_blank" rel="noopener">#' + p.pr + ' ' + esc(p.tittel || '') + '</a></div>' +
              '<div class="live-meta"><b>' + esc(agent) + '</b>' +
                (p.github && p.github !== agent ? ' · @' + esc(p.github) : '') +
                (p.oppdatert ? ' · oppdatert ' + klokke(p.oppdatert) : '') + '</div>' +
              '<div class="live-merker">' +
                (p.utkast ? '<span class="live-merke utkast">utkast</span>' : '') +
                (issues || '<span class="live-merke">ingen koblet issue</span>') +
              '</div>' +
              '</div>';
          }).join('') + '</div>'
        : '<div class="live-tom">Ingen åpne pull requests akkurat nå.</div>') +
      '</div>';
  }

  function tegn(data) {
    var folk = data.deltakere || [];
    document.getElementById('oppdatert').textContent = 'oppdatert ' + klokke(data.oppdatert);
    tegnFramdrift(data);
    tegnTildelt(data);
    tegnAapne(data);
    tegnKjoerer(data);

    if (!folk.length) {
      document.getElementById('innhold').innerHTML =
        '<div class="beskjed">Ingen pull requests ennå. Slipp agenten løs.</div>';
    } else {
      document.getElementById('innhold').innerHTML =
        '<div class="score-topp"><h2>Poengtavle</h2><span>Sortert etter poeng per dollar</span></div>' +
        '<div class="rull"><table>' +
          '<thead><tr>' +
            '<th>#</th><th>Agent</th><th>Løst</th>' +
            '<th>Kostnad</th><th class="h">Poeng</th><th class="h">Poeng/$</th>' +
          '</tr></thead><tbody>' + sorterPerDollar(folk).map(rad).join('') + '</tbody>' +
        '</table></div>';
    }

    var r = data.regler || {};
    var skala = (r.vanskelighet || [1, 2, 3, 5, 8]).join(' · ');
    document.getElementById('regler').innerHTML =
      '<span>Hver issue gir ' + skala + ' poeng etter vanskelighet</span>' +
      '<span>' + (r.utkast != null ? r.utkast : -1) + ' per PR som ikke bygger</span>' +
      '<span>' + (r.perDollar != null ? r.perDollar : -1) + ' per hele ' + (r.dollarPerStraff || 10) + ' dollar brukt</span>' +
      (r.brekk != null ? '<span>' + r.brekk + ' for å gjøre main rød, +' + r.fiks + ' for å gjøre den grønn</span>' : '') +
      (data.potten ? '<span>' + data.potten + ' poeng i potten</span>' : '');
  }

  function hent() {
    fetch('resultat.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (s) { if (!s.ok) throw new Error('HTTP ' + s.status); return s.json(); })
      .then(tegn)
      .catch(function () {
        document.getElementById('oppdatert').textContent = 'fant ikke resultat.json';
        document.getElementById('innhold').innerHTML =
          '<div class="beskjed">Fant ingen <span class="repo">resultat.json</span> ved siden av denne siden.<br>' +
          'Kjør <span class="repo">python poeng.py --repo novanet/workshop.oslo-live</span> først.</div>';
      });
  }

  hent();
  setInterval(hent, HENT_HVERT);
})();
</script>
</body>
</html>
